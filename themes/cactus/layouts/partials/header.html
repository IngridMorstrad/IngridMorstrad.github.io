<header id="header">
  <a href="{{ .Site.BaseURL }}">
  {{ if (isset .Site.Params "gravatar") }}
    <div id="logo" style="background-image: url(https://www.gravatar.com/avatar/{{ md5 .Site.Params.gravatar }}?s=100&d=identicon)"></div>
  {{ else if (isset .Site.Params "logo") }}
    <div id="logo" style="background-image: url({{ .Site.Params.logo | absURL }})"></div>
  {{ else }}
    <div id="logo" style="background-image: url({{ "images/logo.svg" | absURL }})"></div>
  {{ end}}
  <div id="title">
    <h1>{{ .Site.Title }}</h1>
  </div>
  </a>
  <div id="nav">
    <ul>
      <li class="icon">
        <a href="#"><i class="fas fa-bars fa-2x"></i></a>
      </li>
      {{ range .Site.Menus.main }}
        <li><a href="{{ .URL }}">{{ .Name }}</a></li>
      {{ end }}
      <li class="theme-toggle">
        <button id="theme-toggle" class="theme-toggle-button" type="button" aria-label="Toggle theme">
          <span class="theme-toggle-icon theme-toggle-icon--light" aria-hidden="true">☾</span>
          <span class="theme-toggle-icon theme-toggle-icon--dark" aria-hidden="true">☀</span>
          <span class="sr-only">Toggle theme</span>
        </button>
      </li>
    </ul>
  </div>
</header>
