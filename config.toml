theme = "cactus"

baseURL = "https://www.ashwinmenon.com/"

[services]
  [services.googleAnalytics]
    id = "G-5ZWXZPBDDK"

copyright = "Ashwin Menon"

title = "Ashwin's blog"

[[menu.main]]
name = "Home"
url = "/"
weight = 1

[[menu.main]]
name = "All posts"
url = "/posts"
weight = 2

[[menu.main]]
name = "Post by topic"
url = "/tags"
weight = 3

[[menu.main]]
name = "Now"
url = "/now"
weight = 4

[[menu.main]]
name = "Hunchle"
url = "https://www.hunchle.com"
weight = 5

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[pagination]
  pagerSize = 20
  
[params]
  description = "Hi, I'm Ashwin. This is my little corner of the web. You can read about why I blog [here](https://www.ashwinmenon.com/about). Hope you enjoy your stay. To get updates, [subscribe](https://buttondown.email/AshwinMenon)."

  mainSection = "posts"
  showAllPostsOnHomePage = true
  rss = true
  tagsOverview = true

  # Extra site CSS (loaded after the theme CSS)
  css = ["/assets/css/brand.css"]

  [params.comments]
    enabled = true

[[params.social]]
  name = "twitter"
  link = "https://www.twitter.com/TheAshwinMenon"

[[params.social]]
  name = "buttondown"
  link = "https://buttondown.email/AshwinMenon"
  icon = "fas fa-envelope-square"

[[params.feeds]]
  name = "rss"
  link = "/index.xml"

[[params.feeds]]
  name = "atom"
  link = "/atom.xml"

# --- Feeds ---
# Hugo generates RSS by default. We also enable Atom output format so readers can use
# either /index.xml (RSS 2.0) or /atom.xml (Atom 1.0).
[mediaTypes]
  [mediaTypes."application/atom+xml"]
    suffixes = ["xml"]

[outputFormats]
  [outputFormats.ATOM]
    mediaType = "application/atom+xml"
    baseName = "atom"
    # Atom templates must not be HTML-escaped; treat as plain text output.
    isPlainText = true
    rel = "alternate"

[outputs]
  home = ["HTML", "RSS", "ATOM"]
  section = ["HTML", "RSS", "ATOM"]
  taxonomy = ["HTML", "RSS", "ATOM"]
  term = ["HTML", "RSS", "ATOM"]

